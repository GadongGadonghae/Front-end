<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알람 시안 D1 · 상태별 코드 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../가동률/common.css">
<link rel="stylesheet" href="al.css">
<link rel="stylesheet" href="dk.css">
<style>
  /* D1: 1차 D를 다듬은 기본형. 왼쪽 = 상태별 코드 목록(고장 3 · 대기 2 · 정지 2, 누르면 거름) → 손볼 건. 가운데 = 표 */
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="al.js"></script>
<script src="dk.js"></script>
<script>
  const { table, pager, filters } = AL
  DK.mount('시안 D1 · 상태별 코드 목록', (S) => {
    const list = DK.filtered(S)
    return `<main class="page dk">
      <aside class="panel scroll side"><header><h2>오늘 요약</h2><span class="meta">건수 · 시간</span></header>
        <div class="block">${DK.codeGroups(S)}</div>
        <div class="block"><h3>아직 손볼 건<span class="aux">누르면 표를 거름</span></h3>${DK.todo(S)}</div>
      </aside>
      <section class="panel scroll main">${filters()}
        <div class="tblhead"><h2>이력</h2><span class="meta">${list.length}건</span>${DK.chip(S)}</div>
        ${table(list, { sel: S.sel, memo: S.memo })}${pager(list.length)}</section>
    </main>`
  })
</script>
</body>
</html>
