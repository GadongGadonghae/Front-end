<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가동률 시안 D · 시간대 히트맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="common.css">
<style>
  /* D: 라인 × 1시간 칸. 칸의 진하기 = 그 시간에 잃은 비율 (중립 먹색 단계, 빨강은 고장 뜻이라 쓰지 않음).
     칸 안 글자 = 그 시간 가장 큰 손실 상태. "어느 라인이 언제 빠졌나"를 한 장으로 */
  .page { display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; }
  .heat { grid-row: 1 / 3; }
  .hm { display: grid; grid-template-columns: 84px repeat(24, minmax(0, 1fr)) 64px; gap: 3px; align-items: stretch; flex: 1; grid-auto-rows: minmax(0, 1fr); }
  .hm .lb { display: flex; align-items: center; font-weight: 600; font-size: 13px; }
  .hm .v { display: flex; align-items: center; justify-content: flex-end; font-weight: 600; }
  .hm .c { position: relative; display: grid; place-items: center; border-radius: 3px; font: 700 11px/1 var(--font); color: #fff; }
  .hm .c.none { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--line) 4px 5px); }
  .hm .c.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .hm .hd { color: var(--ink-3); font-size: 12px; text-align: center; align-self: end; }
  .scale { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .scale i { width: 18px; height: 12px; border-radius: 2px; display: inline-block; }
  .rank .r { display: grid; grid-template-columns: 20px 56px 1fr 44px; gap: 8px; align-items: center; height: 28px; font-size: 13px; }
  .rank .tr { height: 6px; background: var(--track); border-radius: 3px; }
  .rank .tr i { display: block; height: 100%; background: var(--ink-3); border-radius: 3px; }
  .rank .r.low { font-weight: 600; }
  .rank .r.low .tr i { background: var(--ink); }
  .pick .ev { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .pick .ev .why { grid-column: 2 / 4; color: var(--ink-3); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const { LINES, PLANT, CODES, NOW, fmtDur, fmtHM } = UT
  const { key } = UTH
  const nowH = Math.floor(NOW / 3600)
  // 잃은 비율 → 먹색 단계 (0: 옅은 중립, 커질수록 진함)
  const shade = (run) => {
    const loss = 1 - run
    if (loss < 0.02) return 'background:#e3e7ec'
    const a = Math.min(0.9, 0.25 + loss * 1.2)
    return `background: rgb(22 25 29 / ${a})`
  }
  const dominant = (l, h) => {
    const a = h * 3600; const b = (h + 1) * 3600
    let best = null; let bestSec = 0
    for (const e of l.events) { const s = Math.min(b, e.to) - Math.max(a, e.from); if (s > bestSec) { bestSec = s; best = e } }
    return best
  }
  const rows = LINES.map((l) => `<span class="lb">${l.name}</span>${l.hours.map((run, h) => {
    if (run == null) return '<span class="c none"></span>'
    const d = dominant(l, h)
    return `<span class="c ${l.id === 'B' && h === nowH ? 'sel' : ''}" style="${shade(run)}" title="${l.name} ${h}시 가동 ${(run * 100).toFixed(0)}%">${d && run < 0.98 ? d.s : ''}</span>`
  }).join('')}<span class="v">${l.oee.toFixed(1)}%</span>`).join('')
  document.getElementById('app').innerHTML = UT_SHELL('D · 시간대 히트맵') + `
  <main class="page">
    <section class="panel heat">
      <header><h2>시간대별 가동</h2><span class="meta">칸 진하기 = 그 시간에 잃은 비율 · 칸 글자 = 가장 큰 손실 상태</span>
        <span class="tools"><span class="scale">잃은 비율 <i style="background:#e3e7ec"></i>0% <i style="background:rgb(22 25 29 / .35)"></i><i style="background:rgb(22 25 29 / .6)"></i><i style="background:rgb(22 25 29 / .9)"></i>50% 이상</span></span></header>
      <div class="hm">
        <span></span>${Array.from({ length: 24 }, (_, h) => `<span class="hd">${h % 3 === 0 ? String(h).padStart(2, '0') : ''}</span>`).join('')}<span class="hd" style="text-align:right">OEE</span>
        ${rows}
      </div>
    </section>
    <section class="panel rank">
      <header><h2>라인별 OEE</h2><span class="meta">낮은 순 · 공장 ${PLANT.oee}%</span></header>
      ${LINES.slice().sort((a, b) => a.oee - b.oee).map((l, i) => `<div class="r ${l.oee < PLANT.oee - 5 ? 'low' : ''}"><span class="aux">${i + 1}</span><span>${l.name}</span><span class="tr"><i style="width:${l.oee}%"></i></span><span style="text-align:right">${l.oee.toFixed(1)}</span></div>`).join('')}
      <p class="aux" style="margin-top:10px">공장 시간 ${PLANT.a} · 성능 ${PLANT.p} · 양품 ${PLANT.q} · 라인 수율 ${PLANT.lineYield}</p>
    </section>
    <section class="panel pick">
      <header><h2>B라인 14시</h2><span class="meta">고른 칸의 사건</span></header>
      <div class="ev">${key('D')}<b>프레스 3단 · 알람(관리값 이탈)</b><span>12분째</span><span class="why">14:08 시작 · 압력(좌) 상한 초과 356/350</span></div>
      <div class="ev">${key('I')}<b>프레스 4단 · 재공부족</b><span>12분째</span><span class="why">14:08 시작 · 앞 공정 정지</span></div>
      <p class="aux" style="margin-top:8px">비가동 코드별: ${CODES.map((c) => `${c.code} ${fmtDur(c.sec)}`).join(' · ')}</p>
    </section>
  </main>`
</script>
</body>
</html>
