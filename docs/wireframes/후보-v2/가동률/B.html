<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가동률 시안 B · 라인 카드 격자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="common.css">
<style>
  /* B: 라인마다 같은 모양의 카드(스몰 멀티플). 같은 축, 같은 크기라 눈으로 나란히 비교 */
  .page { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px; }
  .summary { display: flex; align-items: center; gap: 32px; padding: 12px 16px; }
  .summary .figs { display: flex; gap: 32px; }
  .summary .legend { margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; min-height: 0; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--surface); border-radius: var(--r); min-height: 0; }
  .card.low { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .card .top { display: flex; align-items: baseline; gap: 8px; }
  .card h3 { font-size: 16px; }
  .card .top .num { margin-left: auto; }
  .card .delta { color: var(--ink-3); font-size: 13px; }
  .card .delta.neg { color: var(--ink); font-weight: 600; }
  .stack { display: flex; height: 8px; border-radius: 3px; overflow: hidden; background: var(--track); }
  .stack i { height: 100%; }
  .mins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 12px; color: var(--ink-3); }
  .mins b { display: block; color: var(--ink); font-size: 13px; }
  .worst { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .worst .k { margin-right: 6px; }
  .mini-axis { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11px; }
  .codes { display: flex; align-items: center; gap: 24px; padding: 12px 16px; flex-direction: row; }
  .codes h2 { font-size: 16px; white-space: nowrap; }
  .codes .list { display: flex; gap: 24px; flex-wrap: wrap; }
  .codes .list span { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const { LINES, PLANT, CODES, NOW, fmtDur } = UT
  const { track, legend, key } = UTH
  const card = (l) => {
    const load = NOW - l.sum.S
    const worst = l.events.slice().sort((a, b) => (b.to - b.from) - (a.to - a.from))[0]
    const d = l.oee - PLANT.oee
    return `<article class="card ${d < -5 ? 'low' : ''}">
      <div class="top"><h3>${l.name}</h3><span class="delta ${d < 0 ? 'neg' : ''}">공장 대비 ${d > 0 ? '+' : ''}${d.toFixed(1)}</span><span class="num">${l.oee.toFixed(1)}<small>%</small></span></div>
      <div>${track(l, { height: 18 })}<div class="mini-axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>
      <div class="stack" title="부하시간 구성">
        <i class="seg-R" style="width:${(l.sum.R / load) * 100}%"></i><i class="seg-I" style="width:${(l.sum.I / load) * 100}%"></i><i class="seg-D" style="width:${(l.sum.D / load) * 100}%"></i><i class="seg-DC" style="width:${(l.sum.DC / load) * 100}%"></i>
      </div>
      <div class="mins"><span>대기<b>${l.sum.I ? fmtDur(l.sum.I) : '-'}</b></span><span>고장<b>${l.sum.D ? fmtDur(l.sum.D) : '-'}</b></span><span>통신<b>${l.sum.DC ? fmtDur(l.sum.DC) : '-'}</b></span><span>계획정지<b>${l.sum.S ? fmtDur(l.sum.S) : '-'}</b></span></div>
      <p class="worst">${worst ? `${key(worst.s)}가장 긴 손실 · ${worst.code} ${fmtDur(worst.to - worst.from)}${worst.ongoing ? ' (진행 중)' : ''}` : '손실 없음'}</p>
    </article>`
  }
  document.getElementById('app').innerHTML = UT_SHELL('B · 라인 카드 격자') + `
  <main class="page">
    <section class="panel summary">
      <div><p class="aux">공장 종합 OEE</p><p class="key">${PLANT.oee}<small>%</small></p></div>
      <div class="figs">
        <div><p class="aux">시간가동률</p><p class="num">${PLANT.a}<small>%</small></p></div>
        <div><p class="aux">성능가동률</p><p class="num">${PLANT.p}<small>%</small></p></div>
        <div><p class="aux">양품률</p><p class="num">${PLANT.q}<small>%</small></p></div>
        <div><p class="aux">라인 수율</p><p class="num">${PLANT.lineYield}<small>%</small></p></div>
      </div>
      ${legend()}
    </section>
    <section class="grid">${LINES.map(card).join('')}</section>
    <section class="panel codes"><h2>비가동 코드별</h2><div class="list">${CODES.map((c) => `<span>${key(c.s)}${c.code} <b>${fmtDur(c.sec)}</b><span class="aux">${c.n}건</span></span>`).join('')}</div></section>
  </main>`
</script>
</body>
</html>
