<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가동률 시안 F · A 타임라인 + E 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="common.css">
<style>
  /* F (2026-11-19 사용자 선택): 왼쪽 = 공장 종합 + 비가동 코드별 (A의 오른쪽 열을 왼쪽으로)
     오른쪽 위 = 공장 평균 기준선 대비 라인별 OEE (E의 비교, 모든 라인을 같은 무게로 — "가장 낮은 라인" 제목 없음)
     오른쪽 아래 = 줄마다 OEE · 손실 · 24시간 띠 (A의 타임라인) */
  .page { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 16px; }
  .side { grid-row: 1 / 3; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .plant .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 12px; }
  .codes { flex: 1; }
  .code { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .code:first-of-type { border-top: 0; }
  .code .cbar { grid-column: 2 / 4; height: 6px; background: var(--track); border-radius: 3px; }
  .code .cbar i { display: block; height: 100%; border-radius: 3px; }
  .code b { font-weight: 600; white-space: nowrap; }

  /* E의 비교: 기준선(공장 OEE) 위는 높음, 아래는 낮음 */
  .compare .diverge { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px; height: 150px; }
  .dv { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dv .area { position: relative; flex: 1; width: 100%; }
  .dv .area .base { position: absolute; left: -8px; right: -8px; top: 50%; border-top: 1px dashed var(--ink-3); }
  .dv .area i { position: absolute; left: 32%; right: 32%; background: var(--ink-3); }
  .dv .area i.up { bottom: 50%; border-radius: 2px 2px 0 0; }
  .dv .area i.down { top: 50%; border-radius: 0 0 2px 2px; background: var(--ink); }
  .dv b { font-size: 16px; font-weight: 600; }
  .dv .nm { font-size: 13px; }
  .dv .d { font-size: 12px; color: var(--ink-3); }
  .dv .d.neg { color: var(--ink); }

  /* A의 타임라인 */
  .head-row, .row { display: grid; grid-template-columns: 88px 120px 84px minmax(0, 1fr); gap: 0 16px; align-items: center; }
  .head-row { padding: 0 0 6px; border-bottom: 1px solid var(--line-strong); color: var(--ink-3); font-size: 13px; }
  .rows { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .row { flex: 1; min-height: 40px; border-bottom: 1px solid var(--line); }
  .row .nm { font-weight: 600; }
  .row .apq { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
  .row .loss { font-weight: 600; text-align: right; }
  .row .loss small { display: block; color: var(--ink-3); font-weight: 400; font-size: 12px; }
  .row.sel { background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: 6px; }
  .axis-row { display: grid; grid-template-columns: 88px 120px 84px minmax(0, 1fr); gap: 0 16px; padding-top: 6px; }
  /* 낮은 창 (1536×730 등): 비교 막대를 낮추고 줄의 3요소 줄을 숨겨 8줄이 다 들어가게 */
  @media (max-height: 860px) {
    .compare .diverge { height: 104px; }
    .compare .dv b { font-size: 14px; }
    .row { min-height: 28px; }
    .row .apq { display: none; }
    .row .loss small { display: none; }
    .head-row span:nth-child(2) { font-size: 0; }
    .head-row span:nth-child(2)::before { content: "OEE"; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const { LINES, PLANT, CODES, fmtDur } = UT
  const { track, axis, legend, key } = UTH
  const maxCode = Math.max(...CODES.map((c) => c.sec))
  const SPAN = 15 // 기준선 ±15%p = 막대 최대 높이
  const dv = (l) => {
    const d = l.oee - PLANT.oee
    const h = Math.min(50, (Math.abs(d) / SPAN) * 50)
    return `<div class="dv"><div class="area"><span class="base"></span><i class="${d >= 0 ? 'up' : 'down'}" style="height:${h}%"></i></div>
      <b>${l.oee.toFixed(1)}</b><span class="nm">${l.name}</span><span class="d ${d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${d.toFixed(1)}</span></div>`
  }
  document.getElementById('app').innerHTML = UT_SHELL('F · A 타임라인 + E 비교') + `
  <main class="page">
    <aside class="side">
      <section class="panel plant">
        <header><h2>공장 종합</h2><span class="meta">OEE · 오늘</span></header>
        <p class="key">${PLANT.oee}<small>%</small></p>
        <div class="figs">
          <div><p class="aux">시간가동률</p><p class="num">${PLANT.a}<small>%</small></p></div>
          <div><p class="aux">성능가동률</p><p class="num">${PLANT.p}<small>%</small></p></div>
          <div><p class="aux">양품률</p><p class="num">${PLANT.q}<small>%</small></p></div>
          <div><p class="aux">라인 수율</p><p class="num">${PLANT.lineYield}<small>%</small></p></div>
        </div>
      </section>
      <section class="panel codes">
        <header><h2>비가동 코드별</h2><span class="meta">시간 · 건수</span></header>
        ${CODES.map((c) => `<div class="code">${key(c.s)}<span>${c.code}</span><b>${fmtDur(c.sec)} · ${c.n}건</b><span class="cbar"><i class="seg-${c.s}" style="width:${(c.sec / maxCode) * 100}%"></i></span></div>`).join('')}
      </section>
    </aside>

    <section class="panel compare">
      <header><h2>라인별 OEE</h2><span class="meta">점선 = 공장 ${PLANT.oee}% · 위는 높음, 아래는 낮음 · 막대를 누르면 그 라인으로</span></header>
      <div class="diverge">${LINES.map(dv).join('')}</div>
    </section>

    <section class="panel ledger">
      <header><h2>라인별 상태</h2><span class="meta">00~24시 · 가동은 옅게, 손실만 색</span>
        <span class="tools">${legend()}<span class="seg"><b>라인순</b><span>OEE 낮은 순</span></span></span></header>
      <div class="head-row"><span>라인</span><span>OEE · 시간·성능·양품</span><span style="text-align:right">손실 시간</span><span>상태</span></div>
      <div class="rows">
        ${LINES.map((l) => `
        <div class="row ${l.id === 'B' ? 'sel' : ''}">
          <span class="nm">${l.name}</span>
          <span><span class="num">${l.oee.toFixed(1)}<small>%</small></span><span class="apq">${l.a.toFixed(0)} · ${l.p.toFixed(0)} · ${l.q.toFixed(0)}</span></span>
          <span class="loss">${l.loss ? fmtDur(l.loss) : '-'}<small>${l.events.length}건</small></span>
          ${track(l)}
        </div>`).join('')}
      </div>
      <div class="axis-row"><span></span><span></span><span></span>${axis()}</div>
    </section>
  </main>`
</script>
</body>
</html>
