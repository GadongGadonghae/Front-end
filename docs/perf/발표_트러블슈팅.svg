<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic', pretendard, sans-serif" style="font-variant-numeric: tabular-nums">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="36" y="58" font-size="24" font-weight="700" fill="#16191d" text-anchor="start">같은 측정 도구로 잰 개선 전후 (3번 잰 가운데 값)</text><text x="1470" y="58" font-size="23" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><rect x="1440" y="39" width="22" height="22" rx="3" fill="#2149c4"/><text x="1289" y="58" font-size="23" font-weight="400" fill="#16191d" text-anchor="start">시도한 값</text><rect x="1259" y="39" width="22" height="22" rx="3" fill="#a6b6e7"/><text x="1131" y="58" font-size="23" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><rect x="1101" y="39" width="22" height="22" rx="3" fill="#8f96a1"/><rect x="36.75" y="92.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="62" y="146" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">① 3D를 쉬지 않고 계속 다시 그렸다</text><text x="62" y="186" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>값·카메라가 바뀔 때만 그리기</text><text x="62" y="230" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">대시보드를 띄워 둔 5초 동안 자바스크립트 시간</text><text x="62" y="276" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><path d="M166 248H638A4 4 0 0 1 642 252V284A4 4 0 0 1 638 288H166Z" fill="#8f96a1"/><text x="654" y="277" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">408ms</text><text x="62" y="330" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><path d="M166 302H337A4 4 0 0 1 341 306V338A4 4 0 0 1 337 342H166Z" fill="#2149c4"/><text x="353" y="331" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">150ms</text><line x1="166" y1="242" x2="166" y2="348" stroke="#16191d" stroke-width="1.5"/><text x="762" y="337" font-size="44" font-weight="700" fill="#16191d" text-anchor="end"><tspan font-family="'Segoe UI', Arial, sans-serif">−</tspan>63%</text><text x="62" y="436" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">원인: 자바스크립트 시간의 75%가 3D 그리기</text><rect x="812.75" y="92.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="838" y="146" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">② 돌아올 때마다 3D를 새로 만들었다</text><text x="838" y="186" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>대시보드를 지우지 않고 보관</text><text x="838" y="230" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">가동률 → 대시보드로 올 때 3D가 뜨기까지</text><text x="838" y="276" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><path d="M942 248H1414A4 4 0 0 1 1418 252V284A4 4 0 0 1 1414 288H942Z" fill="#8f96a1"/><text x="1430" y="277" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">454ms</text><text x="838" y="330" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><path d="M942 302H1000.9074889867842A4 4 0 0 1 1004.9074889867842 306V338A4 4 0 0 1 1000.9074889867842 342H942Z" fill="#2149c4"/><text x="1016.9074889867842" y="331" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">60ms</text><line x1="942" y1="242" x2="942" y2="348" stroke="#16191d" stroke-width="1.5"/><text x="1538" y="337" font-size="44" font-weight="700" fill="#16191d" text-anchor="end"><tspan font-family="'Segoe UI', Arial, sans-serif">−</tspan>87%</text><text x="838" y="436" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">화면 멈춤 3번(최대 249ms) → 0번</text><rect x="36.75" y="490.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="62" y="544" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">③ 다시 들어간 화면이 비어 있었다</text><text x="62" y="584" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>지난 조회 값을 기억해 먼저 보여 줌</text><text x="62" y="628" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">가동률에 다시 들어갈 때 값이 뜨기까지</text><text x="62" y="674" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><path d="M166 646H638A4 4 0 0 1 642 650V682A4 4 0 0 1 638 686H166Z" fill="#8f96a1"/><text x="654" y="675" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">978ms</text><text x="62" y="728" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><path d="M166 700H191.20245398773005A4 4 0 0 1 195.20245398773005 704V736A4 4 0 0 1 191.20245398773005 740H166Z" fill="#2149c4"/><text x="207.20245398773005" y="729" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">60ms</text><line x1="166" y1="640" x2="166" y2="746" stroke="#16191d" stroke-width="1.5"/><text x="762" y="735" font-size="44" font-weight="700" fill="#16191d" text-anchor="end"><tspan font-family="'Segoe UI', Arial, sans-serif">−</tspan>94%</text><text x="62" y="834" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">서버 조회가 0.6초 걸리는 조건에서 잼</text><rect x="812.75" y="490.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="838" y="544" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">④ 화면을 옮길 때마다 실시간 받기를 새로 시작</text><text x="838" y="584" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>옮기는 동안 실시간 받기를 끊지 않고 유지</text><text x="838" y="624" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">대시보드 → 가동률로 옮긴 뒤 30초 동안 서버 요청</text><text x="838" y="659" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">유지 안 함</text><path d="M1008 638H1081.03125A4 4 0 0 1 1085.03125 642V660A4 4 0 0 1 1081.03125 664H1008Z" fill="#8f96a1"/><text x="1097.03125" y="660" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">58건</text><text x="838" y="693" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">30초 유지</text><path d="M1008 672H1344A4 4 0 0 1 1348 676V694A4 4 0 0 1 1344 698H1008Z" fill="#a6b6e7"/><text x="1360" y="694" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">256건</text><text x="1436" y="693" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">4.4배</text><text x="838" y="727" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">5초 유지</text><path d="M1008 706H1135.484375A4 4 0 0 1 1139.484375 710V728A4 4 0 0 1 1135.484375 732H1008Z" fill="#a6b6e7"/><text x="1151.484375" y="728" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">99건</text><text x="838" y="761" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">2초 유지</text><path d="M1008 740H1094.3125A4 4 0 0 1 1098.3125 744V762A4 4 0 0 1 1094.3125 766H1008Z" fill="#2149c4"/><text x="1110.3125" y="762" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">68건</text><text x="1171.3125" y="761" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">채택</text><line x1="1008" y1="632" x2="1008" y2="772" stroke="#16191d" stroke-width="1.5"/><text x="838" y="802" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">오래 유지하면 떠난 화면 몫 요청이 계속 나가 2초로</text><text x="838" y="834" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">라인 상세로 옮길 때는 서버 요청 51 → 39건</text>
</svg>
