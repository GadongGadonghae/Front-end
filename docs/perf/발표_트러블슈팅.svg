<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic', pretendard, sans-serif" style="font-variant-numeric: tabular-nums">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="36" y="58" font-size="24" font-weight="700" fill="#16191d" text-anchor="start">같은 측정 도구로 잰 개선 전후 (3번 잰 가운데 값)</text><text x="1470" y="58" font-size="23" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><rect x="1440" y="39" width="22" height="22" rx="3" fill="#2149c4"/><text x="1312" y="58" font-size="23" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><rect x="1282" y="39" width="22" height="22" rx="3" fill="#8f96a1"/><rect x="36.75" y="92.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="62" y="146" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">① 3D를 쉬지 않고 계속 다시 그렸다</text><text x="62" y="186" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>값·카메라가 바뀔 때만 그리기</text><text x="62" y="230" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">대시보드를 띄워 둔 5초 동안 자바스크립트 시간</text><text x="62" y="276" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><path d="M166 248H638A4 4 0 0 1 642 252V284A4 4 0 0 1 638 288H166Z" fill="#8f96a1"/><text x="654" y="277" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">408ms</text><text x="62" y="330" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><path d="M166 302H337A4 4 0 0 1 341 306V338A4 4 0 0 1 337 342H166Z" fill="#2149c4"/><text x="353" y="331" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">150ms</text><line x1="166" y1="242" x2="166" y2="348" stroke="#16191d" stroke-width="1.5"/><text x="762" y="337" font-size="44" font-weight="700" fill="#16191d" text-anchor="end"><tspan font-family="'Segoe UI', Arial, sans-serif">−</tspan>63%</text><text x="62" y="436" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">원인: 자바스크립트 시간의 75%가 3D 그리기</text><rect x="812.75" y="92.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="838" y="146" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">② 돌아올 때마다 3D를 새로 만들었다</text><text x="838" y="186" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>대시보드를 지우지 않고 보관</text><text x="838" y="230" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">가동률 → 대시보드로 올 때 3D가 뜨기까지</text><text x="838" y="276" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><path d="M942 248H1414A4 4 0 0 1 1418 252V284A4 4 0 0 1 1414 288H942Z" fill="#8f96a1"/><text x="1430" y="277" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">454ms</text><text x="838" y="330" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><path d="M942 302H1000.9074889867842A4 4 0 0 1 1004.9074889867842 306V338A4 4 0 0 1 1000.9074889867842 342H942Z" fill="#2149c4"/><text x="1016.9074889867842" y="331" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">60ms</text><line x1="942" y1="242" x2="942" y2="348" stroke="#16191d" stroke-width="1.5"/><text x="1538" y="337" font-size="44" font-weight="700" fill="#16191d" text-anchor="end"><tspan font-family="'Segoe UI', Arial, sans-serif">−</tspan>87%</text><text x="838" y="436" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">화면 멈춤 3번(최대 249ms) → 0번</text><rect x="36.75" y="490.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="62" y="544" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">③ 다시 들어간 화면이 비어 있었다</text><text x="62" y="584" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>지난 조회 값을 기억해 먼저 보여 줌</text><text x="62" y="628" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">가동률에 다시 들어갈 때 값이 뜨기까지</text><text x="62" y="674" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><path d="M166 646H638A4 4 0 0 1 642 650V682A4 4 0 0 1 638 686H166Z" fill="#8f96a1"/><text x="654" y="675" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">978ms</text><text x="62" y="728" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><path d="M166 700H191.20245398773005A4 4 0 0 1 195.20245398773005 704V736A4 4 0 0 1 191.20245398773005 740H166Z" fill="#2149c4"/><text x="207.20245398773005" y="729" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">60ms</text><line x1="166" y1="640" x2="166" y2="746" stroke="#16191d" stroke-width="1.5"/><text x="762" y="735" font-size="44" font-weight="700" fill="#16191d" text-anchor="end"><tspan font-family="'Segoe UI', Arial, sans-serif">−</tspan>94%</text><text x="62" y="834" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">서버 조회가 0.6초 걸리는 조건에서 잼</text><rect x="812.75" y="490.75" width="750.5" height="372.5" rx="10" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.5"/><text x="838" y="544" font-size="31" font-weight="700" fill="#16191d" text-anchor="start">④ 깜빡임 하나가 매 프레임 다시 그렸다</text><text x="838" y="584" font-size="24" fill="#16191d"><tspan font-weight="700">해결 </tspan>색 대신 투명도만 바꾸기 (모양은 그대로)</text><text x="838" y="628" font-size="22" font-weight="700" fill="#16191d" text-anchor="start">대시보드를 띄워 둔 5초 동안 브라우저 작업 시간</text><text x="838" y="674" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 전</text><path d="M942 646H1414A4 4 0 0 1 1418 650V682A4 4 0 0 1 1414 686H942Z" fill="#8f96a1"/><text x="1430" y="675" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">449ms</text><text x="838" y="728" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">개선 후</text><path d="M942 700H1215.7550111358573A4 4 0 0 1 1219.7550111358573 704V736A4 4 0 0 1 1215.7550111358573 740H942Z" fill="#2149c4"/><text x="1231.7550111358573" y="729" font-size="26" font-weight="700" fill="#16191d" text-anchor="start">262ms</text><line x1="942" y1="640" x2="942" y2="746" stroke="#16191d" stroke-width="1.5"/><text x="1538" y="735" font-size="44" font-weight="700" fill="#16191d" text-anchor="end"><tspan font-family="'Segoe UI', Arial, sans-serif">−</tspan>42%</text><text x="838" y="802" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">원인: 고장 라인 줄의 배경색 깜빡임</text><text x="838" y="834" font-size="22" font-weight="400" fill="#16191d" text-anchor="start">5초에 스타일 다시 계산 8번 → 581번</text>
</svg>
